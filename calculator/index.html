<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>채움디자인 · 예상 견적서</title>
<meta property="og:title" content="채움디자인 · 예상 견적서" />
<meta property="og:description" content="3분이면 우리 집 리모델링 예상 견적을 확인할 수 있어요." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"></script>
<style>
  :root{
    --bg:#FBF9F5; --ink:#1F2A3D; --ink-soft:#5B6577;
    --panel:#F3E9DB; --panel-deep:#EADFCE; --line:#DDD3C2;
    --brass:#A9781E; --brass-deep:#8C6417; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .serif{ font-family:'Noto Serif KR', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }

  .grid-bg{ position:fixed; inset:0; z-index:-1; opacity:0.5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 10%, transparent 70%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 10%, transparent 70%); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; max-width:720px; margin:0 auto; padding:24px 20px 0 20px; }
  .brand-row{ display:flex; align-items:center; }
  .brand-badge{ width:34px; height:34px; margin-right:9px; display:flex; align-items:center; justify-content:center; }
  .brand-badge img{ width:100%; height:100%; object-fit:contain; }
  .brand-name{ font-size:17px; font-weight:700; }
  .topbar-phone{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); }

  .stage{ max-width:720px; margin:20px auto 60px auto; padding:0 20px; }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 1px 2px rgba(31,42,61,.03), 0 18px 40px -22px rgba(31,42,61,.18); overflow:hidden; }

  .head{ padding:16px 24px 14px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .head-label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--brass-deep); font-weight:600; }
  .head-count{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .progress-track{ height:4px; background:rgba(31,42,61,.1); border-radius:3px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--brass); border-radius:3px; transition:width .3s ease; }

  .step-body{ padding:26px 24px 22px 24px; min-height:280px; }
  .step-title{ font-size:19px; font-weight:700; margin:0 0 6px 0; line-height:1.4; }
  .step-desc{ font-size:12.5px; color:var(--ink-soft); margin:0 0 20px 0; line-height:1.6; }
  .note-footer{ display:block; margin-top:6px; font-size:11px; color:#9C9385; }
  .material-note{ margin-top:20px; padding:11px 13px; border-radius:8px; background:#FAF6EF; border:1px solid var(--line);
    font-size:11.5px; line-height:1.6; color:var(--ink-soft); }
  .field-hint{ display:block; margin-top:6px; font-size:11px; line-height:1.55; color:#9C9385; }
  .info-block{ margin-bottom:22px; padding:16px 15px 6px 15px; border:1px solid var(--line); border-radius:10px; background:#FAF6EF; }
  .info-block-title{ font-family:'Noto Serif KR',serif; font-size:14px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .info-block-hint{ font-size:11.5px; line-height:1.55; color:var(--ink-soft); margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .info-block .field{ margin-bottom:12px; }
  .stepper-box.mini{ padding:8px 0 4px 0; }
  .stepper-box.mini .stepper-num{ font-size:26px; min-width:80px; }
  .stepper-box.mini .stepper-input{ font-size:26px; width:64px; }
  .stepper-box.mini .stepper-btn{ width:38px; height:38px; font-size:19px; }
  .info-block .stepper-hint{ margin-top:2px; }
  .field textarea{ width:100%; box-sizing:border-box; font-family:'Pretendard',sans-serif; font-size:14px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:8px; padding:12px 13px; background:var(--white); resize:vertical; line-height:1.55; }
  .field textarea:focus{ outline:none; border-color:var(--brass); }
  .field textarea::placeholder{ color:#B8AF9F; }

  .choice-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; max-width:100%; }
  .choice-grid.single-col{ grid-template-columns:minmax(0,1fr); }
  .mode-grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  @media (min-width:620px){ .mode-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  .mode-card{ font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; position:relative; border:1px solid var(--line); border-left:3px solid var(--panel-deep); border-radius:10px;
    padding:20px 20px 22px 20px; background:var(--white); cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; }
  .mode-card:hover, .mode-card:focus-visible{ border-left-color:var(--brass); box-shadow:0 3px 14px rgba(31,42,61,.07); }
  .mode-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .mode-name{ font-family:inherit; font-size:16.5px; font-weight:700; color:var(--ink); margin:0; letter-spacing:-0.2px; }
  .mode-count{ flex:none; font-family:inherit; font-size:12px; color:var(--brass-deep); }
  .mode-count b{ font-family:inherit; font-size:15px; font-weight:700; margin-right:2px; }
  .mode-desc{ font-size:13px; line-height:1.7; color:var(--ink-soft); margin:0 0 14px 0; }
  .mode-list{ list-style:none; margin:0; padding:0; }
  .mode-list li{ position:relative; padding-left:16px; margin-bottom:6px; font-size:12.5px; line-height:1.5; color:var(--ink); }
  .mode-list li:last-child{ margin-bottom:0; }
  .mode-list li::before{ content:""; position:absolute; left:0; top:9px; width:8px; height:1px; background:var(--brass); }
  .mode-list li.nowrap-line{ white-space:nowrap; letter-spacing:-0.3px; }
  .mode-switch{ margin-top:14px; text-align:center; }
  .mode-switch .btn{ font-size:13px; padding:11px 18px; }
  .exclude-box{ margin-top:18px; padding:14px 15px; border:1px solid var(--line); border-radius:10px; background:#FAF6EF; }
  .exclude-title{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .exclude-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .exclude-item{ display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border:1.5px solid var(--line);
    border-radius:8px; background:var(--white); font-size:13px; color:var(--ink); cursor:pointer; }
  .exclude-item.on{ border-color:var(--brass); background:#FBF3E4; font-weight:700; }
  .exclude-item input{ width:15px; height:15px; accent-color:var(--brass); margin:0; }
  .choice-grid.three{ grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); }
  @media (max-width:560px){ .choice-grid.three{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  @media (max-width:400px){ .step-body{ padding:22px 14px 18px 14px; } .choice{ padding:10px 10px; } .choice-grid{ gap:8px; } }

  .choice{ border:1.5px solid var(--line); border-radius:10px; padding:14px 14px; cursor:pointer; transition:.15s ease; background:var(--white); position:relative; min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .choice:hover{ border-color:var(--brass); }
  .choice.selected{ border-color:var(--brass); background:#FBF4E7; box-shadow:0 0 0 1px var(--brass) inset; }
  .swatch{ position:relative; z-index:1; width:100%; min-height:44px; height:auto; border-radius:7px; margin-bottom:10px; padding:8px 6px;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.3;
    font-family:'Pretendard',sans-serif; font-weight:700; font-size:12.5px; color:var(--white); }
  .photo-swatch{ z-index:1; width:100%; height:auto; aspect-ratio:4/3; border-radius:7px; margin-bottom:10px; overflow:hidden; position:relative; background:#E7E1D8; }
  .photo-swatch img{ width:100%; height:100%; object-fit:cover; display:block; }
  .choice.selected .photo-swatch{ box-shadow: inset 0 0 0 3px var(--brass); }
  .ci-title{ font-weight:700; font-size:14px; margin-bottom:3px; }
  .ci-price{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--brass-deep); font-weight:600; margin-bottom:2px;}
  .ci-sub{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:10px; }
  .bath-tabs{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .bath-apply-note{ font-size:11px; color:var(--ink-soft); line-height:1.5; margin:0 0 16px 0; padding:8px 12px; background:var(--panel); border-radius:8px; }
  .bath-tab{ font-family:'Pretendard',sans-serif; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:100px;
    border:1.5px solid var(--line); background:var(--white); color:var(--ink-soft); cursor:pointer; transition:.15s ease; }
  .bath-tab:hover{ border-color:var(--brass); }
  .bath-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--white); }
  .bath-tab.filled:not(.active){ border-color:var(--brass); color:var(--brass-deep); }
  .ci-note{ font-size:11px; color:var(--ink-soft); line-height:1.5; margin-top:8px; }
  .note-intro{ margin:0 0 10px 0; }
  .note-list{ margin:0; padding-left:16px; }
  .note-list li{ margin-bottom:3px; }
  .note-footer2{ margin-top:8px; color:#9C9385; font-size:10.5px; }
  .check{ position:absolute; top:10px; right:10px; z-index:5; width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line); background:var(--white); box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 1px 5px rgba(0,0,0,0.35); }
  .choice.selected .check{ border-color:var(--brass); background:var(--brass); }
  .choice.selected .check::after{ content:""; display:block; width:5px; height:9px; border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg); margin:3px auto 0 auto; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .field input[type=text], .field input[type=tel], .field input[type=date], .field input[type=number]{ width:100%; box-sizing:border-box; padding:13px 14px; border:1.5px solid var(--line); border-radius:8px; font-size:14.5px; font-family:inherit; color:var(--ink); background:var(--white); -webkit-appearance:none; appearance:none; }
  .field input[type=date]{ font-size:14px; min-height:48px; }
  .field input::placeholder{ color:#B8AF9F; }
  .field-hint{ font-size:11px; color:var(--ink-soft); margin:6px 2px 0 2px; line-height:1.5; }
  .field input:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  .consent{ display:flex; align-items:flex-start; gap:9px; font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.55; }
  .consent input{ margin-top:3px; }

  .stepper-box{ display:flex; align-items:center; justify-content:center; gap:20px; padding:22px 0 6px 0; }
  .stepper-btn{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--white); font-size:18px; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s ease; }
  .stepper-btn:hover{ border-color:var(--brass); color:var(--brass-deep); }
  .stepper-num{ font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:700; min-width:120px; text-align:center; }
  .stepper-input{ font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:700; text-align:center; width:90px;
    border:none; border-bottom:2px solid var(--line); background:transparent; color:var(--ink); padding:0 0 2px 0; }
  .stepper-input:focus{ outline:none; border-bottom-color:var(--brass); }
  .stepper-input::-webkit-inner-spin-button, .stepper-input::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .stepper-num .unit{ font-size:16px; color:var(--ink-soft); margin-left:4px; }
  .stepper-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .divider{ height:1px; background:var(--line); margin:22px 0 18px 0; }

  .step-nav{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-top:1px solid var(--line); background:#FCFBF9; }
  .btn{ font-family:inherit; font-size:13.5px; font-weight:700; padding:11px 20px; border-radius:8px; border:1.5px solid transparent; cursor:pointer; transition:.15s ease; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn-ghost:disabled{ opacity:0; pointer-events:none; }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:#101724; }
  .btn-primary:disabled{ background:#C7CCD3; cursor:not-allowed; }
  .btn-brass{ background:var(--brass); color:var(--white); }
  .btn-brass:hover{ background:var(--brass-deep); }

  .result-wrap{ padding:34px 24px 26px 24px; text-align:center; }
  .result-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:.04em; }
  .dimline{ position:relative; margin:20px auto 6px auto; max-width:520px; padding:0 10px 22px 10px; }
  .dimline .price{ font-family:'Noto Serif KR',serif; font-weight:900; font-size:clamp(26px,6.4vw,44px); color:var(--ink); }
  .dimline .price .tilde{ color:var(--brass-deep); margin:0 8px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .dimline-rule{ position:relative; height:1px; background:var(--ink-soft); margin-top:16px; }
  .dimline-rule::before,.dimline-rule::after{ content:""; position:absolute; top:-4px; width:1px; height:9px; background:var(--ink-soft); }
  .dimline-rule::before{ left:0; } .dimline-rule::after{ right:0; }
  .dimline-cap{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:5px; display:flex; justify-content:space-between; }
  .disclaimer{ font-size:12px; color:var(--ink-soft); max-width:440px; margin:16px auto 22px auto; line-height:1.6; background:var(--panel); border-radius:8px; padding:12px 16px; }
  .summary-scroll{ max-height:260px; overflow-y:auto; text-align:left; max-width:460px; margin:0 auto 22px auto; border:1px solid var(--line); border-radius:8px; }
  .summary-row{ display:flex; justify-content:space-between; gap:10px; padding:8px 12px; font-size:12px; border-bottom:1px solid var(--line); }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:var(--ink-soft); }
  .summary-row .v{ font-weight:700; text-align:right; white-space:nowrap; }
  .success-box{ display:none; } .success-box.show{ display:block; }
  .cta-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .cta-row .btn{ padding:13px 24px; font-size:14px; }
  .consult-bar{ padding:16px 22px 22px 22px; border-top:1px solid var(--line); text-align:center; background:#FAF6EF; }
  .consult-bar .btn{ width:100%; max-width:320px; padding:13px 20px; font-size:14px; }
  .consult-lead{ margin-bottom:12px; font-size:13px; line-height:1.6; color:var(--ink); font-weight:600; }
  .consult-phone{ margin-top:10px; font-size:13px; color:var(--ink-soft); }
  .consult-phone a{ color:var(--brass); font-weight:700; text-decoration:none; border-bottom:1px solid rgba(169,120,30,.4); padding-bottom:1px; }
  .consult-bar.hidden{ display:none; }
  @media (max-width:400px){ .consult-bar{ padding:14px 14px 18px 14px; } }
  .btn-sm{ padding:8px 14px !important; font-size:12px !important; }
  .result-section-title{ font-size:15px; font-weight:700; color:var(--ink); text-align:left; margin:26px 0 4px 0; }
  .result-hint{ font-size:11.5px; color:var(--ink-soft); text-align:left; margin:0 0 14px 0; }
  .result-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:16px 9px; text-align:center; max-width:100%; }
  .result-item{ border:none; background:transparent; min-width:0; overflow-wrap:anywhere; }
  .result-swatch{ position:relative; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
    border-radius:12px; overflow:hidden; border:1px solid var(--line);
    font-family:'Pretendard',sans-serif; font-weight:700; font-size:11px; color:#fff; cursor:pointer; text-align:center; padding:6px; line-height:1.3; }
  .result-swatch.has-photo{ background-size:cover; background-position:center; padding:0; }
  .result-swatch.has-photo > span{ display:none; }
  .result-overlay{ position:absolute; inset:0; background:rgba(31,42,61,0.72); display:none; align-items:center; justify-content:center; }
  .result-item.show-overlay .result-overlay{ display:flex; }
  .result-overlay .btn{ font-size:10px; padding:6px 8px; line-height:1.2; }
  .result-label{ font-size:11px; font-weight:700; color:var(--ink); padding:7px 2px 0 2px; line-height:1.35; }
  .result-value{ font-size:10px; color:var(--ink-soft); padding:2px 2px 0 2px; line-height:1.4; }
  @media (min-width:560px){ .result-grid{ grid-template-columns:repeat(auto-fill, minmax(118px,1fr)); gap:18px 12px; } }
  footer{ max-width:720px; margin:0 auto; padding:0 20px 50px 20px; text-align:center; font-size:11px; color:var(--ink-soft); }
  @media print{
    .topbar, .head, .step-nav, .cta-row, .consult-bar, .result-overlay, footer{ display:none !important; }
    .result-swatch.has-photo{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body{ background:#fff; }
    .card{ box-shadow:none !important; border:none !important; }
    .stage{ margin:0 !important; padding:0 !important; max-width:100% !important; }
    .result-grid{ grid-template-columns:repeat(4, minmax(0,1fr)); }
  }
  .step-panel{ display:none; } .step-panel.active{ display:block; animation:fadeUp .3s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .step-panel.active{ animation:none; } .progress-fill{ transition:none; } }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="topbar">
  <div class="brand-row">
    <div class="brand-badge"><img src="images/logo.png" alt="채움디자인 로고"/></div>
    <div><div class="brand-name">채움디자인</div></div>
  </div>
  <div class="topbar-phone">☎ 010-7507-5681</div>
</div>

<div class="stage">
  <div class="card">
    <div class="head">
      <div class="head-row">
        <span class="head-label" id="headLabel">위치</span>
        <span class="head-count" id="headCount">1 / 32</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div id="panelHost"></div>
    <div id="consultBar" class="consult-bar">
      <p class="consult-lead">선택이 어려우신 경우, 전문가와 상담해 보세요.</p>
      <button type="button" class="btn btn-brass" id="consultBtn">맞춤 상담받기</button>
      <p class="consult-phone">또는 <a href="tel:01075075681">010-7507-5681</a>로 전화 주세요</p>
    </div>
  </div>
</div>

<footer>채움디자인 · 대표 유석호 · 본 계산기는 참고용 예상 견적을 제공하며, 확정 견적이 아닙니다.</footer>

<script>
(function(){
  const COLORS = ['#8C6417','#2F3E58','#7A8B6F','#9C5B4A','#5B7C99','#8A6E9C'];
  function colorFor(i){ return COLORS[i % COLORS.length]; }

  // ---------- pricing helpers (shared by card display + final compute) ----------
  const PROFIT_MARGIN = 1; // 입력하신 단가에 이미 기업이윤이 포함되어 있어 추가 배율을 곱하지 않음
  function mLow(opt){ return opt.low*PROFIT_MARGIN; }
  function mHigh(opt){ return opt.high*PROFIT_MARGIN; }
  function rangeText(low, high){
    return low===high ? fmt(low) : fmt(low)+'~'+fmt(high);
  }

      { id:'own', label:'고객님이 준비', low:0, high:0, note:'원하시는 휴지걸이를 직접 준비하여 진행하시는 방법입니다.<br/>✓ 직접 준비하시는 경우 선택<br/>✓ 시공비만 별도 협의' },

  // ============================================================

  const BAL_PHOTO = { living:'images/balcony-living.jpg', room:'images/balcony-room.jpg' };

  const state = {
    mode: null,
    excludes: { finish:{}, kitchen:{} },
    request: '', startDate: '', moveDate: '', budget: '',
    region:'', aptName:'', pyeong:24, bathCount:1,
    selections:{}, // key -> option id
    balcony:{ living:false, roomCount:0, keep:false },

  // full flow: location, pyeong, ...GENERIC_STEPS(with 'jungmun' inserted after sinkfaucet)..., contact, result
  const SIMPLE_KEYS = ['demolition','sash','balcony','finish','kitchen','jungmun','bathroom',
    'heating','aircon','package','lighting','cleaning'];
  const DETAIL_KEYS = ['demolition','sash','balcony','wallpaper','floor','sink','sinktop','sinkbowl','sinkfaucet',
    'jungmun','bathtile','toilet','bathupper','basin','showerfaucet','showerpartition','jendai','fan','ceiling',
    'bathlight','meji','towelbar','paperbar','heating','aircon','package','lighting','cleaning'];
  function buildFlow(mode){
    const keys = (mode==='detail') ? DETAIL_KEYS : SIMPLE_KEYS;
    return ['mode','location','pyeong'].concat(keys).concat(['result','contact']);
  }
  let FLOW = buildFlow('simple');
  let TOTAL_STEPS = FLOW.length - 2; // exclude mode & contact from denominator
  function applyMode(m){
    state.mode = m;
    FLOW = buildFlow(m);
    TOTAL_STEPS = FLOW.length - 2;
  }
  let flowIndex = 0;
  let editReturnIndex = null; // when set, "다음"/선택 완료 후 이 인덱스(결과 화면)로 돌아감

  const STEP_BY_KEY = {};

  const panelHost = document.getElementById('panelHost');

  if(consultBtnEl) consultBtnEl.addEventListener('click', ()=>goConsult());
  const headLabel = document.getElementById('headLabel');
  const headCount = document.getElementById('headCount');
  const progressFill = document.getElementById('progressFill');

  function fmt(n){ return n.toLocaleString('ko-KR'); }

  // ---------- generic single-select step renderer ----------
  let activeBathTab = 0;

  function renderGenericStep(def){
    const TWO_COL = ['jendai','fan','ceiling','bathlight','lighting','cleaning'];
    const cols = def.options.length >= 5 ? '' : (def.options.length===2 ? (TWO_COL.indexOf(def.key)>=0?'':'single-col') : (def.options.length===3?'three':''));
    let descHtml = def.desc;
    if(def.perMeter){
      const len = lengthFor(def).toFixed(1);
      descHtml += ` <strong>입력하신 ${state.pyeong}평 기준 추정 길이 약 ${len}m로 계산돼요.</strong>`;
    }

    const isMultiBath = def.perBath && state.bathCount > 1;
    if(!Array.isArray(state.selections[def.key])){
      const prev = typeof state.selections[def.key] === 'string' ? state.selections[def.key] : null;
      state.selections[def.key] = def.perBath ? [prev] : state.selections[def.key];
    }

    let tabsHtml = '';
    if(isMultiBath){
      tabsHtml = `<div class="bath-tabs">`;
      for(let i=0;i<state.bathCount;i++){
        const filled = !!state.selections[def.key][i];
        tabsHtml += `<button type="button" class="bath-tab ${i===activeBathTab?'active':''} ${filled?'filled':''}" data-i="${i}">욕실 ${i+1}${filled?' ✓':''}</button>`;
      }
      tabsHtml += `</div>`;
      tabsHtml += `<p class="bath-apply-note">선택하신 옵션은 욕실 ${state.bathCount}곳에 모두 일괄 적용됩니다.<br/>욕실마다 다른 옵션을 원하신다면 해당 욕실 탭을 선택한 뒤 항목을 골라주세요.</p>`;
    }

    let html = `<div class="step-body">
      <h2 class="step-title">${def.title}</h2>
      <p class="step-desc">${descHtml}</p>
      ${tabsHtml}
      <div class="choice-grid ${cols}" id="grid_${def.key}">`;
    def.options.forEach((opt,i)=>{
      const { l, h } = optTotal(def, opt);
      const priceLabel = priceLabelFor(l, h, opt.openEnded);
      const sub = unitSubtext(def, opt);
      const oLabel = optLabel(opt);
      const swatchHtml = opt.photo
        ? `<div class="photo-swatch"><img src="${opt.photo}" alt="${oLabel}"/></div>`
        : `<div class="swatch" style="background:${colorFor(i)}">${oLabel}</div>`;
      html += `<div class="choice" data-id="${opt.id}">
        <div class="check"></div>
        ${swatchHtml}
        <div class="ci-title">${oLabel}</div>
        <div class="ci-price">${priceLabel}</div>
        ${sub ? `<div class="ci-sub">${sub}</div>` : ''}
        <div class="ci-note">${formatNote(opt.note)}</div>
      </div>`;
    });
    html += `</div>`;
    if(def.excludes){
      html += `<div class="exclude-box"><div class="exclude-title">제외할 항목이 있으신가요?</div><div class="exclude-list">`;
      def.excludes.forEach(ex=>{
        const on = isEx(def.key, ex.id);
        html += `<label class="exclude-item${on?' on':''}"><input type="checkbox" data-ex="${ex.id}" ${on?'checked':''}/><span>${ex.label}</span></label>`;
      });
      html += `</div></div>`;
    }
    html += `</div>
    <div class="step-nav">
      <button class="btn btn-ghost" id="prevBtn">이전</button>
      <button class="btn btn-primary" id="nextBtn" disabled>다음</button>
    </div>`;
    panelHost.innerHTML = html;

    const grid = document.getElementById(`grid_${def.key}`);
    if(def.excludes){
      panelHost.querySelectorAll('.exclude-item input').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const id = cb.dataset.ex;
          state.excludes[def.key] = state.excludes[def.key] || {};
          state.excludes[def.key][id] = cb.checked;
          if(def.key==='finish' && isEx('finish','floor') && isEx('finish','wall')){
            delete state.selections.finish;
          }
          if(def.key==='kitchen' && id==='none' && cb.checked){
            state.excludes.kitchen.fixtures = false;
            state.selections.kitchen = 'keep';
          }
          const saveTab = activeBathTab;
          renderGenericStep(def);
          activeBathTab = saveTab;
        });
      });
    }
    const nextBtn = document.getElementById('nextBtn');

    function currentSaved(){
      return def.perBath ? state.selections[def.key][activeBathTab] : state.selections[def.key];
    }
    function allBathsFilled(){
      if(!def.perBath) return !!state.selections[def.key];
      for(let i=0;i<state.bathCount;i++){ if(!state.selections[def.key][i]) return false; }
      return true;
    }

    const saved = currentSaved();
    grid.querySelectorAll('.choice').forEach(el=>{
      if(el.dataset.id === saved){ el.classList.add('selected'); }
      el.addEventListener('click', ()=>{
        if(def.key==='kitchen' && isEx('kitchen','none')) return;
        const wasSelected = el.classList.contains('selected');
        grid.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
        if(!wasSelected) el.classList.add('selected');
        if(def.perBath){
          const arr = state.selections[def.key];
          if(wasSelected){
            // 같은 항목 다시 누르면 해제
            const cur = arr[activeBathTab];
            const sameEverywhere = arr.every(v=>v===cur);
            if(sameEverywhere){ for(let i=0;i<state.bathCount;i++){ arr[i] = null; } }
            else { arr[activeBathTab] = null; }
          } else {
            const hadAnySelection = arr.some(v=>v);
            if(!hadAnySelection){
              // first pick for this step: apply to every bathroom by default
              for(let i=0;i<state.bathCount;i++){ arr[i] = el.dataset.id; }
            } else {
              arr[activeBathTab] = el.dataset.id;
            }
          }
        }
        else if(wasSelected){ delete state.selections[def.key]; }
        else { state.selections[def.key] = el.dataset.id; }
        if(!wasSelected && def.key === 'sink' && el.dataset.id === 'keep'){
          delete state.selections.sinktop;
          delete state.selections.sinkbowl;
          delete state.selections.sinkfaucet;
        }
        nextBtn.disabled = !allBathsFilled();
        if(isMultiBath){
          // refresh tab checkmarks without losing scroll position
          document.querySelectorAll('.bath-tab').forEach((t,i)=>{
            t.classList.toggle('filled', !!state.selections[def.key][i]);
            t.textContent = `욕실 ${i+1}${state.selections[def.key][i]?' ✓':''}`;
          });
        }
      });
    });
    nextBtn.disabled = !allBathsFilled();

    if(isMultiBath){
      document.querySelectorAll('.bath-tab').forEach(t=>{
        t.addEventListener('click', ()=>{
          activeBathTab = parseInt(t.dataset.i, 10);
          renderGenericStep(def);
        });
      });
    }

    document.getElementById('prevBtn').addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    applyEditLabels();
  }

  function renderPyeong(){

        <button class="stepper-btn" id="pyDown">−</button>

        <button class="stepper-btn" id="pyUp">+</button>

      <p class="stepper-hint">숫자를 직접 눌러서 입력할 수도 있어요</p>

      <h2 class="step-title" style="font-size:16px;">리모델링할 욕실 개수</h2>
      <div class="stepper-box" style="padding:14px 0 4px 0;">
        <button class="stepper-btn" id="bathDown">−</button>
        <div class="stepper-num" style="font-size:30px; min-width:90px;"><input type="number" id="bathInput" class="stepper-input" style="font-size:30px; width:70px;" value="${state.bathCount}" min="1" max="4"/><span class="unit">개</span></div>
        <button class="stepper-btn" id="bathUp">+</button>
      </div>
    </div>
    <div class="step-nav">
      <button class="btn btn-ghost" id="prevBtn">이전</button>
      <button class="btn btn-primary" id="nextBtn">다음</button>
    </div>`;
    const pyInput = document.getElementById('pyInput');
    const bathInput = document.getElementById('bathInput');
    const clampPy = v => Math.min(60, Math.max(10, isNaN(v)?10:v));
    const clampBath = v => Math.min(4, Math.max(1, isNaN(v)?1:v));

    document.getElementById('pyUp').addEventListener('click', ()=>{ state.pyeong=clampPy(state.pyeong+1); pyInput.value=state.pyeong; });
    document.getElementById('pyDown').addEventListener('click', ()=>{ state.pyeong=clampPy(state.pyeong-1); pyInput.value=state.pyeong; });

    pyInput.addEventListener('blur', ()=>{ pyInput.value=state.pyeong; });

    document.getElementById('bathUp').addEventListener('click', ()=>{ state.bathCount=clampBath(state.bathCount+1); bathInput.value=state.bathCount; });
    document.getElementById('bathDown').addEventListener('click', ()=>{ state.bathCount=clampBath(state.bathCount-1); bathInput.value=state.bathCount; });
    bathInput.addEventListener('input', ()=>{ const v=parseInt(bathInput.value,10); if(!isNaN(v)) state.bathCount=clampBath(v); });
    bathInput.addEventListener('blur', ()=>{ bathInput.value=state.bathCount; });

    document.getElementById('prevBtn').addEventListener('click', goPrev);
    document.getElementById('nextBtn').addEventListener('click', goNext);
  }

    keepEl.addEventListener('click', ()=>{

        keepEl.classList.remove('selected');
      }
    });
    document.getElementById('roomUp').addEventListener('click', ()=>{ state.balcony.roomCount=Math.min(5,(state.balcony.roomCount||1)+1); roomVal.textContent=state.balcony.roomCount; });
    document.getElementById('roomDown').addEventListener('click', ()=>{ state.balcony.roomCount=Math.max(1,(state.balcony.roomCount||1)-1); roomVal.textContent=state.balcony.roomCount; });

    document.getElementById('nextBtn').addEventListener('click', goNext);

  // ---------- compute ----------
  function computeTotal(){
    let low=0, high=0;
    const rows = [];

    GENERIC_STEPS.forEach(def=>{
      const sel = state.selections[def.key];
      if(!sel) return;
      if(def.perBath){
        if(!Array.isArray(sel)) return;
        let sumL=0, sumH=0, anyOpen=false; const labels=[];
        for(let i=0;i<state.bathCount;i++){
          const id = sel[i];
          if(!id) return; // incomplete selection for this step, skip entirely
          const opt = def.options.find(o=>o.id===id);
          const { l, h } = optTotal(def, opt);
          sumL += l; sumH += h; if(opt.openEnded) anyOpen=true;
          labels.push(state.bathCount>1 ? `욕실${i+1} ${optLabel(opt)}` : optLabel(opt));
        }
        low += sumL; high += sumH;
        const firstOpt = def.options.find(o=>o.id===sel[0]);
        rows.push([def.label, labels.join(' · '), sumL, sumH, def.key, firstOpt&&firstOpt.photo?firstOpt.photo:'', anyOpen]);
        return;
      }
      const opt = def.options.find(o=>o.id===sel);
      const { l, h } = optTotal(def, opt);
      low += l; high += h;
      rows.push([def.label, optLabel(opt), l, h, def.key, opt.photo||'', !!opt.openEnded]);
    });

    // balcony
    let bl=0, bh=0;
    if(state.balcony.living){ bl+=160*PROFIT_MARGIN; bh+=180*PROFIT_MARGIN; }
    if(state.balcony.roomCount>0){ bl+=150*PROFIT_MARGIN*state.balcony.roomCount; bh+=170*PROFIT_MARGIN*state.balcony.roomCount; }
    if(bl>0||bh>0){ low+=bl; high+=bh; rows.push(['발코니 확장', (state.balcony.living?'거실 ':'')+(state.balcony.roomCount>0?'방 '+state.balcony.roomCount+'개':''), bl, bh, 'balcony', state.balcony.living?BAL_PHOTO.living:BAL_PHOTO.room]); }
    else if(state.balcony.keep){ rows.push(['발코니 확장', '현상태 유지', 0, 0, 'balcony']); }

    // jungmun
    if(state.jungmun.styleId === 'keep'){
      rows.push(['중문', '현상태 유지', 0, 0, 'jungmun']);
    }
    else if(state.jungmun.styleId && state.jungmun.count>0){
      const d = state.jungmun._data;
      const jl = d.low*PROFIT_MARGIN*state.jungmun.count, jh = d.high*PROFIT_MARGIN*state.jungmun.count;
      low+=jl; high+=jh;
      rows.push(['중문', d.label+' × '+state.jungmun.count+'개소', jl, jh, 'jungmun', d.photo||'']);
    }

    const round = n => Math.round(n/10)*10;
    return { low:round(low), high:round(high), rows };
  }

  // ---------- result ----------
  function renderResult(){
    const { low, high, rows } = computeTotal();

    const items = [];
    rows.forEach(([label,val,l,h,key,photo,open])=>{
      const priceStr = priceLabelFor(Math.round(l), Math.round(h), open);
      items.push({ key, label, value: val, price: priceStr, photo: photo||'' });
    });

    let gridHtml = '';
    items.forEach((it,i)=>{
      gridHtml += `<div class="result-item" data-key="${it.key}">
        <div class="result-swatch${it.photo?' has-photo':''}" style="${it.photo?`background-image:url('${it.photo}')`:`background:${colorFor(i)}`}">
          <span>${it.label}</span>
          <div class="result-overlay"><button type="button" class="btn btn-brass btn-sm result-edit-btn">항목 변경하기</button></div>
        </div>
        <div class="result-label">${it.label}</div>
        <div class="result-value">${it.value}${it.price?` · ${it.price}`:''}</div>
      </div>`;
    });

    panelHost.innerHTML = `<div class="result-wrap">
      <div class="result-eyebrow">ESTIMATED RANGE</div>
      <div class="dimline">
        <div class="price"><span>${fmt(low)}만원</span><span class="tilde">~</span><span>${fmt(high)}만원</span></div>
        <div class="dimline-rule"></div>
        <div class="dimline-cap"><span>MIN</span><span>MAX</span></div>
      </div>
      <div class="disclaimer">입력하신 항목을 기준으로 한 <strong>참고용 예상 견적</strong>입니다. 실제 금액은 현장 실측과 자재 선택에 따라 달라질 수 있으며, 정확한 견적은 무료 방문 상담 후 확정해 드립니다.<br/><br/>이 견적 그대로 실제 상담을 받아보실 수 있어요. 실제 상담을 받아보신 후 최종 결정을 하실 수 있습니다.</div>
      <div class="material-note">※ 각 항목에 제시된 자재는 기본 사양이며, 고객님께서 원하시는 제품으로 변경 가능합니다.</div>

      <div class="result-section-title">공사리스트</div>
      <p class="result-hint">해당 사진을 선택하면 수정이 가능합니다.</p>
      <div class="result-grid" id="resultGrid">${gridHtml}</div>

      <div class="cta-row" style="margin-top:22px;">
        <button class="btn btn-ghost" id="pdfBtn">PDF로 저장</button>
        <button class="btn btn-brass" id="toContactBtn">무료 상담 신청하기</button>
      </div>
      ${state.mode==='simple' ? `<div class="mode-switch"><button type="button" class="btn btn-ghost" id="toDetailBtn">상세 견적 산정으로 다시 확인하기</button></div>` : ''}
    </div>
    <div class="step-nav"><button class="btn btn-ghost" id="prevBtn">이전</button><button class="btn btn-ghost" id="restartBtn">처음부터 다시</button></div>`;

    // swatch click -> toggle overlay; overlay button click -> navigate to that step for editing
    document.querySelectorAll('.result-item').forEach(item=>{
      item.querySelector('.result-swatch').addEventListener('click', ()=>{
        const isOpen = item.classList.contains('show-overlay');
        document.querySelectorAll('.result-item').forEach(el=>el.classList.remove('show-overlay'));
        if(!isOpen) item.classList.add('show-overlay');
      });
      const editBtn = item.querySelector('.result-edit-btn');
      if(editBtn){
        editBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          goEdit(item.dataset.key);
        });
      }
    });

    document.getElementById('pdfBtn').addEventListener('click', ()=>{ window.print(); });
    document.getElementById('toContactBtn').addEventListener('click', goNext);
    const toDetailBtn = document.getElementById('toDetailBtn');
    if(toDetailBtn) toDetailBtn.addEventListener('click', ()=>{
      const ok = window.confirm('상세 견적 산정으로 넘어가면 지금까지 선택하신 자재가 초기화됩니다.\n위치와 평형 정보는 그대로 유지됩니다.\n\n계속하시겠어요?');
      if(!ok) return;
      state.selections = {};
      state.balcony = {living:false, roomCount:0, keep:false};
      state.jungmun = {styleId:null, count:0};
      state.excludes = {finish:{}, kitchen:{}};
      applyMode('detail');
      editReturnIndex = null;
      flowIndex = FLOW.indexOf('demolition');
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    document.getElementById('restartBtn').addEventListener('click', restart);
    document.getElementById('prevBtn').addEventListener('click', goPrev);
  }

  // ============================================================
  // NAVIGATION ENGINE
  // ============================================================
  function render(){
    const key = FLOW[flowIndex];
    headCount.textContent = key==='mode' ? '' : flowIndex+' / '+TOTAL_STEPS;
    progressFill.style.width = (flowIndex/(FLOW.length-1))*100+'%';

    const consultBar = document.getElementById('consultBar');
    if(consultBar) consultBar.classList.toggle('hidden', key==='contact' || key==='result' || key==='mode');

    if(key==='mode'){ headLabel.textContent='시작하기'; renderMode(); }
    else if(key==='location'){ headLabel.textContent='위치'; renderLocation(); }
    else if(key==='pyeong'){ headLabel.textContent='규모'; renderPyeong(); }
    else if(key==='balcony'){ headLabel.textContent='발코니확장'; renderBalcony(); }
    else if(key==='jungmun'){ headLabel.textContent='중문'; renderJungmun(); }
    else if(key==='contact'){ headLabel.textContent='연락처'; renderContact(); }
    else if(key==='result'){ headLabel.textContent='결과'; renderResult(); }
    else { const def = STEP_BY_KEY[key]; headLabel.textContent=def.label; activeBathTab = 0; renderGenericStep(def); }

    applyEditLabels();
  }

  // 편집 모드에서 버튼 문구 유지 (부분 다시 그리기 후에도 적용)
  function applyEditLabels(){
    if(editReturnIndex === null) return;
    if(FLOW[flowIndex] === 'result') return;
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.textContent = '변경완료 · 결과로 돌아가기';
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn){ prevBtn.textContent = '결과로 돌아가기'; prevBtn.disabled = false; }
  }

  function goConsult(){
    const idx = FLOW.indexOf('contact');
    if(idx === -1) return;
    editReturnIndex = null;
    flowIndex = idx;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function shouldSkip(key){
    if(key==='sinktop' || key==='sinkbowl' || key==='sinkfaucet'){
      return state.selections.sink === 'keep';
    }
    return false;
  }
  function goNext(){
    if(editReturnIndex !== null){
      flowIndex = editReturnIndex;
      editReturnIndex = null;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    let next = Math.min(flowIndex+1, FLOW.length-1);
    while(next < FLOW.length-1 && shouldSkip(FLOW[next])) next++;
    flowIndex = next; render(); window.scrollTo({top:0, behavior:'smooth'});
  }
  function goPrev(){
    if(editReturnIndex !== null){
      flowIndex = editReturnIndex;
      editReturnIndex = null;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    let prev = Math.max(flowIndex-1, 0);
    while(prev > 0 && shouldSkip(FLOW[prev])) prev--;
    flowIndex = prev; render(); window.scrollTo({top:0, behavior:'smooth'});
  }
  function goEdit(stepKey){
    const idx = FLOW.indexOf(stepKey);
    if(idx === -1) return;
    editReturnIndex = flowIndex; // remember to come back to result
    flowIndex = idx;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function restart(){
    state.region=''; state.aptName=''; state.pyeong=24; state.bathCount=1;
    state.selections={}; state.balcony={living:false,roomCount:0,keep:false};
    state.jungmun={styleId:null,count:0}; state.name=''; state.phone=''; state.consent=false;
    state.mode=null; state.excludes={finish:{},kitchen:{}};
    state.startDate=''; state.moveDate=''; state.budget=''; state.request='';
    FLOW=buildFlow('simple'); TOTAL_STEPS=FLOW.length-2;
    flowIndex=0; render();
  }

  render();
})();
</script>
<script data-goatcounter="https://chaeum-89.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
