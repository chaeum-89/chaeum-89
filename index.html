<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>채움디자인 · 세상에서 가장 편한 견적</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"></script>
<style>
  :root{
    --bg:#FBF9F5; --ink:#1F2A3D; --ink-soft:#5B6577;
    --panel:#F3E9DB; --panel-deep:#EADFCE; --line:#DDD3C2;
    --brass:#A9781E; --brass-deep:#8C6417; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .serif{ font-family:'Noto Serif KR', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }

  .grid-bg{ position:fixed; inset:0; z-index:-1; opacity:0.5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 10%, transparent 70%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 10%, transparent 70%); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; max-width:720px; margin:0 auto; padding:24px 20px 0 20px; }
  .brand-row{ display:flex; align-items:center; }
  .brand-badge{ width:34px; height:34px; margin-right:9px; display:flex; align-items:center; justify-content:center; }
  .brand-badge img{ width:100%; height:100%; object-fit:contain; }
  .brand-name{ font-size:17px; font-weight:700; }
  .topbar-phone{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); }

  .stage{ max-width:720px; margin:20px auto 60px auto; padding:0 20px; }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 1px 2px rgba(31,42,61,.03), 0 18px 40px -22px rgba(31,42,61,.18); overflow:hidden; }

  .head{ padding:16px 24px 14px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .head-label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--brass-deep); font-weight:600; }
  .head-count{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .progress-track{ height:4px; background:rgba(31,42,61,.1); border-radius:3px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--brass); border-radius:3px; transition:width .3s ease; }

  .step-body{ padding:26px 24px 22px 24px; min-height:280px; }
  .step-title{ font-size:19px; font-weight:700; margin:0 0 6px 0; line-height:1.4; }
  .step-desc{ font-size:12.5px; color:var(--ink-soft); margin:0 0 20px 0; line-height:1.6; }

  .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice-grid.single-col{ grid-template-columns:1fr; }
  .choice-grid.three{ grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:560px){ .choice-grid.three{ grid-template-columns:1fr 1fr; } }

  .choice{ border:1.5px solid var(--line); border-radius:10px; padding:14px 14px; cursor:pointer; transition:.15s ease; background:var(--white); position:relative; }
  .choice:hover{ border-color:var(--brass); }
  .choice.selected{ border-color:var(--brass); background:#FBF4E7; box-shadow:0 0 0 1px var(--brass) inset; }
  .swatch{ width:100%; min-height:44px; height:auto; border-radius:7px; margin-bottom:10px; padding:8px 6px;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.3;
    font-family:'Pretendard',sans-serif; font-weight:700; font-size:12.5px; color:var(--white); }
  .ci-title{ font-weight:700; font-size:14px; margin-bottom:3px; }
  .ci-price{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--brass-deep); font-weight:600; margin-bottom:2px;}
  .ci-sub{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:5px; }
  .ci-note{ font-size:11px; color:var(--ink-soft); line-height:1.5; }
  .check{ position:absolute; top:12px; right:12px; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--line); background:var(--white); }
  .choice.selected .check{ border-color:var(--brass); background:var(--brass); }
  .choice.selected .check::after{ content:""; display:block; width:5px; height:9px; border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg); margin:2px auto 0 auto; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .field input[type=text], .field input[type=tel]{ width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:8px; font-size:14.5px; font-family:inherit; color:var(--ink); background:var(--white); }
  .field input:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  .consent{ display:flex; align-items:flex-start; gap:9px; font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.55; }
  .consent input{ margin-top:3px; }

  .stepper-box{ display:flex; align-items:center; justify-content:center; gap:20px; padding:22px 0 6px 0; }
  .stepper-btn{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--white); font-size:18px; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s ease; }
  .stepper-btn:hover{ border-color:var(--brass); color:var(--brass-deep); }
  .stepper-num{ font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:700; min-width:120px; text-align:center; }
  .stepper-num .unit{ font-size:16px; color:var(--ink-soft); margin-left:4px; }
  .stepper-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .divider{ height:1px; background:var(--line); margin:22px 0 18px 0; }

  .step-nav{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-top:1px solid var(--line); background:#FCFBF9; }
  .btn{ font-family:inherit; font-size:13.5px; font-weight:700; padding:11px 20px; border-radius:8px; border:1.5px solid transparent; cursor:pointer; transition:.15s ease; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn-ghost:disabled{ opacity:0; pointer-events:none; }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:#101724; }
  .btn-primary:disabled{ background:#C7CCD3; cursor:not-allowed; }
  .btn-brass{ background:var(--brass); color:var(--white); }
  .btn-brass:hover{ background:var(--brass-deep); }

  .result-wrap{ padding:34px 24px 26px 24px; text-align:center; }
  .result-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:.04em; }
  .dimline{ position:relative; margin:20px auto 6px auto; max-width:520px; padding:0 10px 22px 10px; }
  .dimline .price{ font-family:'Noto Serif KR',serif; font-weight:900; font-size:clamp(26px,6.4vw,44px); color:var(--ink); }
  .dimline .price .tilde{ color:var(--brass-deep); margin:0 8px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .dimline-rule{ position:relative; height:1px; background:var(--ink-soft); margin-top:16px; }
  .dimline-rule::before,.dimline-rule::after{ content:""; position:absolute; top:-4px; width:1px; height:9px; background:var(--ink-soft); }
  .dimline-rule::before{ left:0; } .dimline-rule::after{ right:0; }
  .dimline-cap{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:5px; display:flex; justify-content:space-between; }
  .disclaimer{ font-size:12px; color:var(--ink-soft); max-width:440px; margin:16px auto 22px auto; line-height:1.6; background:var(--panel); border-radius:8px; padding:12px 16px; }
  .summary-scroll{ max-height:260px; overflow-y:auto; text-align:left; max-width:460px; margin:0 auto 22px auto; border:1px solid var(--line); border-radius:8px; }
  .summary-row{ display:flex; justify-content:space-between; gap:10px; padding:8px 12px; font-size:12px; border-bottom:1px solid var(--line); }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:var(--ink-soft); }
  .summary-row .v{ font-weight:700; text-align:right; white-space:nowrap; }
  .success-box{ display:none; } .success-box.show{ display:block; }
  .cta-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .cta-row .btn{ padding:13px 24px; font-size:14px; }
  footer{ max-width:720px; margin:0 auto; padding:0 20px 50px 20px; text-align:center; font-size:11px; color:var(--ink-soft); }
  .step-panel{ display:none; } .step-panel.active{ display:block; animation:fadeUp .3s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .step-panel.active{ animation:none; } .progress-fill{ transition:none; } }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
</style>
</head>

  // full flow: location, pyeong, ...GENERIC_STEPS(with 'jungmun' inserted after sinkfaucet)..., contact, result
  function buildFlow(){
    const genericKeys = GENERIC_STEPS.map(s=>s.key);
    const flow = ['location','pyeong'];
    genericKeys.forEach(k=>{
      flow.push(k);
      if(k==='sink'){} // balcony inserted after sash below
      if(k==='sash') flow.push('balcony');
      if(k==='sinkfaucet') flow.push('jungmun');
    });
    flow.push('contact','result');
    return flow;
  }
  const FLOW = buildFlow();
  const TOTAL_STEPS = FLOW.length - 1; // exclude result from denominator display

  // ---------- generic single-select step renderer ----------
  function renderGenericStep(def){
    const cols = def.options.length >= 5 ? '' : (def.options.length===2?'single-col':(def.options.length===3?'three':''));
    let html = `<div class="step-body">
      <h2 class="step-title">${def.title}</h2>
      <p class="step-desc">${def.desc}</p>
      <div class="choice-grid ${cols}" id="grid_${def.key}">`;
    def.options.forEach((opt,i)=>{
      const { l, h } = optTotal(def, opt);
      const priceLabel = priceLabelFor(l, h, opt.openEnded);
      const sub = unitSubtext(def, opt);
      html += `<div class="choice" data-id="${opt.id}">
        <div class="check"></div>
        <div class="swatch" style="background:${colorFor(i)}">${opt.label}</div>
        <div class="ci-title">${opt.label}</div>
        <div class="ci-price">${priceLabel}</div>
        ${sub ? `<div class="ci-sub">${sub}</div>` : ''}
        <div class="ci-note">${opt.note}</div>
      </div>`;
    });
    html += `</div></div>
    <div class="step-nav">
      <button class="btn btn-ghost" id="prevBtn">이전</button>
      <button class="btn btn-primary" id="nextBtn" disabled>다음</button>
    </div>`;
    panelHost.innerHTML = html;

    const grid = document.getElementById(`grid_${def.key}`);
    const nextBtn = document.getElementById('nextBtn');
    const saved = state.selections[def.key];
    grid.querySelectorAll('.choice').forEach(el=>{
      if(el.dataset.id === saved){ el.classList.add('selected'); nextBtn.disabled=false; }
      el.addEventListener('click', ()=>{
        grid.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
        state.selections[def.key] = el.dataset.id;
        nextBtn.disabled = false;
      });
    });
    document.getElementById('prevBtn').addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
  }

  // ---------- compute ----------
  function computeTotal(){
    let low=0, high=0;
    const rows = [];

    GENERIC_STEPS.forEach(def=>{
      const selId = state.selections[def.key];
      if(!selId) return;
      const opt = def.options.find(o=>o.id===selId);
      const { l, h } = optTotal(def, opt);
      low += l; high += h;
      rows.push([def.label, opt.label, l, h]);
    });

    // balcony
    let bl=0, bh=0;
    if(state.balcony.living){ bl+=250; bh+=330; }
    if(state.balcony.kitchen){ bl+=200; bh+=280; }
    if(state.balcony.roomCount>0){ bl+=200*state.balcony.roomCount; bh+=280*state.balcony.roomCount; }
    if(bl>0||bh>0){ low+=bl; high+=bh; rows.push(['발코니 확장', (state.balcony.living?'거실 ':'')+(state.balcony.kitchen?'주방 ':'')+(state.balcony.roomCount>0?'방 '+state.balcony.roomCount+'개':''), bl, bh]); }

    // jungmun
    if(state.jungmun.styleId && state.jungmun.count>0){
      const d = state.jungmun._data;
      const jl = d.low*state.jungmun.count, jh = d.high*state.jungmun.count;
      low+=jl; high+=jh;
      rows.push(['중문', d.label+' × '+state.jungmun.count+'개소', jl, jh]);
    }

    const round = n => Math.round(n/10)*10;
    return { low:round(low), high:round(high), rows };
  }

  // ---------- result ----------
  function renderResult(){
    const { low, high, rows } = computeTotal();
    let rowsHtml = `<div class="summary-row"><span class="k">위치</span><span class="v">${state.region} · ${state.aptName}</span></div>
      <div class="summary-row"><span class="k">평형 / 욕실</span><span class="v">${state.pyeong}평 · ${state.bathCount}개</span></div>`;
    rows.forEach(([label,val,l,h])=>{
      const priceStr = (l===0&&h===0) ? '0원' : (Math.round(l)===Math.round(h) ? fmt(Math.round(l))+'만원' : fmt(Math.round(l))+'~'+fmt(Math.round(h))+'만원');
      rowsHtml += `<div class="summary-row"><span class="k">${label} · ${val}</span><span class="v">${priceStr}</span></div>`;
    });

    panelHost.innerHTML = `<div class="result-wrap">
      <div class="result-eyebrow">ESTIMATED RANGE</div>
      <div class="dimline">
        <div class="price"><span>${fmt(low)}만원</span><span class="tilde">~</span><span>${fmt(high)}만원</span></div>
        <div class="dimline-rule"></div>
        <div class="dimline-cap"><span>MIN</span><span>MAX</span></div>
      </div>
      <div class="disclaimer">입력하신 항목을 기준으로 한 <strong>참고용 예상 견적</strong>입니다. 실제 금액은 현장 실측과 자재 선택에 따라 달라질 수 있으며, 정확한 견적은 무료 방문 상담 후 확정해 드립니다.</div>
      <div class="summary-scroll">${rowsHtml}</div>
      <div id="preSubmit"><div class="cta-row"><button class="btn btn-brass" id="submitBtn">무료 상담 신청하기</button></div></div>
      <div class="success-box" id="successBox">
        <p style="font-weight:700; font-size:15px; margin-bottom:6px;">상담 신청이 접수됐어요 ✓</p>
        <p style="font-size:13px; color:var(--ink-soft); margin-bottom:18px;">빠른 시일 내에 채움디자인이 직접 연락드릴게요.</p>
        <div class="cta-row"><a class="btn btn-ghost" href="tel:01075075681">전화로 바로 문의</a></div>
      </div>
    </div>
    <div class="step-nav"><button class="btn btn-ghost" id="prevBtn">이전</button><button class="btn btn-ghost" id="restartBtn">처음부터 다시</button></div>`;

    document.getElementById('submitBtn').addEventListener('click', function(){
      const subject = '[채움디자인] 온라인 견적 상담 신청 - '+state.name;
      const bodyLines = ['이름: '+state.name, '연락처: '+state.phone, '지역: '+state.region, '아파트명: '+state.aptName,
        '평형: '+state.pyeong+'평', '욕실: '+state.bathCount+'개', '예상 견적: '+fmt(low)+'만원 ~ '+fmt(high)+'만원', '', '--- 선택 항목 ---'];
      rows.forEach(([label,val])=>bodyLines.push(label+': '+val));
      const bodyText = bodyLines.join('\n');
      const submitBtn = this;
      submitBtn.disabled = true;
      submitBtn.textContent = '전송 중...';

      // 자동 이메일 전송 (Formspree). FORM_ID를 발급받은 값으로 교체하세요.
      const FORMSPREE_ID = 'mkjwkevo';
      const endpoint = 'https://formspree.io/f/'+FORMSPREE_ID;

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
        body: JSON.stringify({
          _subject: subject,
          이름: state.name, 연락처: state.phone, 지역: state.region, 아파트명: state.aptName,
          평형: state.pyeong+'평', 욕실: state.bathCount+'개',
          예상견적: fmt(low)+'만원 ~ '+fmt(high)+'만원',
          상세내역: bodyText,
        }),
      }).then(res=>{
        if(res.ok){
          document.getElementById('preSubmit').style.display='none';
          document.getElementById('successBox').classList.add('show');
        } else {
          throw new Error('전송 실패');
        }
      }).catch(()=>{
        // 자동 전송 실패 시 메일 앱 열기로 대체
        const mailBody = encodeURIComponent(bodyText);
        window.location.href = 'mailto:chaeum_89@naver.com?subject='+encodeURIComponent(subject)+'&body='+mailBody;
        submitBtn.disabled = false;
        submitBtn.textContent = '무료 상담 신청하기';
      });
    });
    document.getElementById('restartBtn').addEventListener('click', restart);
    document.getElementById('prevBtn').addEventListener('click', goPrev);
  }

  // ============================================================
  // NAVIGATION ENGINE
  // ============================================================
  function render(){
    const key = FLOW[flowIndex];
    headCount.textContent = (flowIndex+1)+' / '+(TOTAL_STEPS+1);
    progressFill.style.width = (flowIndex/(FLOW.length-1))*100+'%';

    if(key==='location'){ headLabel.textContent='위치'; renderLocation(); }
    else if(key==='pyeong'){ headLabel.textContent='규모'; renderPyeong(); }
    else if(key==='balcony'){ headLabel.textContent='발코니확장'; renderBalcony(); }
    else if(key==='jungmun'){ headLabel.textContent='중문'; renderJungmun(); }
    else if(key==='contact'){ headLabel.textContent='연락처'; renderContact(); }
    else if(key==='result'){ headLabel.textContent='결과'; renderResult(); }
    else { const def = STEP_BY_KEY[key]; headLabel.textContent=def.label; renderGenericStep(def); }

    panelHost.parentElement.querySelector('.card') || null;
    const activeCard = document.querySelector('.card');
  }

  function goNext(){ flowIndex = Math.min(flowIndex+1, FLOW.length-1); render(); window.scrollTo({top:0, behavior:'smooth'}); }
  function goPrev(){ flowIndex = Math.max(flowIndex-1, 0); render(); window.scrollTo({top:0, behavior:'smooth'}); }

  function restart(){
    state.region=''; state.aptName=''; state.pyeong=24; state.bathCount=1;
    state.selections={}; state.balcony={living:false,kitchen:false,roomCount:0};
    state.jungmun={styleId:null,count:0}; state.name=''; state.phone=''; state.consent=false;
    flowIndex=0; render();
  }

  render();
})();
</script>
</body>
</html>
